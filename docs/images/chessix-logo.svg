      <rect x="54" y="54" width="46" height="46"/><rect x="146" y="54" width="46" height="46"/>
      <rect x="8" y="100" width="46" height="46"/><rect x="100" y="100" width="46" height="46"/>
      <rect x="54" y="146" width="46" height="46"/><rect x="146" y="146" width="46" height="46"/>
    </g>
  </g>
  <!-- knight -->
  <path fill="#14202b" stroke="#e8e2c8" stroke-width="3" stroke-linejoin="round"
