  <text x="220" y="140" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="30" letter-spacing="10" fill="#2e5b3a">LINUX</text>
  <text x="220" y="170" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#555">Revive old PCs. Play better chess.</text>
