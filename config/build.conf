# Build settings (sourced by scripts). Override via environment variables.
TC_VERSION="${TC_VERSION:-15.x}"          # Tiny Core release series
TC_RELEASE="${TC_RELEASE:-15.0}"          # ISO release number
TC_ARCH="${TC_ARCH:-x86}"                 # x86 or x86_64
TC_MIRROR="${TC_MIRROR:-http://tinycorelinux.net}"
OUT_DIR="${OUT_DIR:-build}"
ISO_NAME="${ISO_NAME:-chesscore-${TC_RELEASE}-${TC_ARCH}.iso}"
