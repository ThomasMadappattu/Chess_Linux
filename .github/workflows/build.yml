name: Build ChessCore ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # weekly refresh of Tiny Core packages

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TC_ARCH: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y xorriso cpio curl squashfs-tools build-essential git
      - name: Fetch Tiny Core packages
        run: sh scripts/fetch-packages.sh
      - name: Build chess engines (static, packaged as .tcz)
        run: sh scripts/build-engines.sh
      - name: Build ISO
        run: sh scripts/build-iso.sh
      - name: Report packages not available
        run: cat build/missing.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: chesscore-x86_64
          path: |
            build/*.iso
            build/missing.txt
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.iso
